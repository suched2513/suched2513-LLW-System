name: Duty Notifications

on:
  schedule:
    - cron: '0 23 * * *'   # 06:00 ICT ทุกวัน (23:00 UTC วันก่อน)
  workflow_dispatch:        # ทดสอบด้วยมือ

jobs:
  notify-daily:
    runs-on: ubuntu-latest
    steps:
      - name: ส่งสรุปตารางเวรประจำวัน
        run: |
          curl -sf "https://llw.krusuched.com/duty/cron/notify_duty.php?key=${{ secrets.DUTY_NOTIFY_KEY }}" \
            -o /tmp/result.json && cat /tmp/result.json
