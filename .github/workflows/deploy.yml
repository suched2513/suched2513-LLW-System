# =====================================================================
# GitHub Actions: Auto Deploy LLW System ไปยัง Production (FTP)
# =====================================================================
# Trigger: push to main หรือกด Run workflow ด้วยมือ
#
# ขั้นตอน:
#   1. Checkout โค้ดจาก repo
#   2. สร้างไฟล์ config/ ใหม่จาก GitHub Secrets (ทับของเดิม)
#   3. ลบไฟล์ test/debug ที่ไม่ต้องการใน production
#   4. FTP upload ขึ้น hosting ด้วย lftp (รองรับ passive mode)
#
# Secrets ที่ต้องตั้งค่าใน GitHub → Settings → Secrets → Actions:
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR
#   DB_HOST, DB_USER, DB_PASS, DB_NAME
#   DB_CENTRAL_NAME, DB_PROJECT_NAME
#   TELEGRAM_TOKEN, TELEGRAM_BOSS1_CHAT_ID
# =====================================================================

name: "🚀 Deploy to Production"

on:
  push:
    branches: [main]
  workflow_dispatch:

# ป้องกัน deploy ซ้อนกัน — ยกเลิก run เก่าถ้ามี run ใหม่
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: "📦 Build & Deploy"
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout code ────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── 2. สร้าง config/database.php (Main DB) ─────────────
      - name: Generate config/database.php
        run: |
          cat > config/database.php << 'PHPEOF'
          <?php
          /**
           * ศูนย์กลางการตั้งค่าฐานข้อมูล — LLW System (Production)
           * ไฟล์นี้ถูกสร้างอัตโนมัติโดย GitHub Actions
           */

          require_once __DIR__ . '/academic.php';

          define('DB_HOST', '${{ secrets.DB_HOST }}');
          define('DB_USER', '${{ secrets.DB_USER }}');
          define('DB_PASS', '${{ secrets.DB_PASS }}');
          define('DB_NAME', '${{ secrets.DB_NAME }}');

          ini_set('default_charset', 'UTF-8');
          mb_internal_encoding('UTF-8');
          mb_http_output('UTF-8');

          date_default_timezone_set('Asia/Bangkok');

          function getWfhConn(): mysqli
          {
              $conn = new mysqli(DB_HOST, DB_USER, DB_PASS, DB_NAME);
              if ($conn->connect_error) {
                  error_log('[LLW] DB connect error: ' . $conn->connect_error);
                  die('ไม่สามารถเชื่อมต่อฐานข้อมูลได้ กรุณาติดต่อผู้ดูแลระบบ');
              }
              $conn->set_charset('utf8mb4');
              return $conn;
          }

          function getPdo(): PDO
          {
              $dsn = 'mysql:host=' . DB_HOST . ';dbname=' . DB_NAME . ';charset=utf8mb4';
              try {
                  $pdo = new PDO($dsn, DB_USER, DB_PASS);
                  $pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
                  $pdo->setAttribute(PDO::ATTR_DEFAULT_FETCH_MODE, PDO::FETCH_ASSOC);
                  return $pdo;
              } catch (PDOException $e) {
                  error_log('[LLW] PDO connect error: ' . $e->getMessage());
                  die('ไม่สามารถเชื่อมต่อฐานข้อมูลได้ กรุณาติดต่อผู้ดูแลระบบ');
              }
          }
          PHPEOF

      # ─── 2.5 สร้าง school_project/config/db.php ────────────
      - name: Generate school_project/config/db.php
        run: |
          cat > school_project/config/db.php << 'PHPEOF'
          <?php
          $parentConfig = __DIR__ . '/../../config/database.php';
          if (file_exists($parentConfig) && !function_exists('getPdo')) {
              require_once $parentConfig;
          }
          if (!defined('DB_HOST')) define('DB_HOST', '${{ secrets.DB_HOST }}');
          if (!defined('DB_USER')) define('DB_USER', '${{ secrets.DB_USER }}');
          if (!defined('DB_PASS')) define('DB_PASS', '${{ secrets.DB_PASS }}');
          if (!defined('DB_NAME')) define('DB_NAME', '${{ secrets.DB_NAME }}');
          function getDB(): PDO {
              static $pdo = null;
              if ($pdo !== null) return $pdo;
              if (function_exists('getPdo')) { $pdo = getPdo(); return $pdo; }
              try {
                  $pdo = new PDO('mysql:host='.DB_HOST.';dbname='.DB_NAME.';charset=utf8mb4', DB_USER, DB_PASS, [
                      PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
                      PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,
                      PDO::ATTR_EMULATE_PREPARES => false,
                  ]);
              } catch (PDOException $e) { die('ไม่สามารถเชื่อมต่อฐานข้อมูลได้'); }
              return $pdo;
          }
          PHPEOF

      # ─── 3. ลบไฟล์ที่ไม่ต้องการใน production ────────────────
      - name: Remove test/debug files
        run: |
          rm -f test_*.php fix_*.php debug_*.php reset_*.php temp_*.php check_*.php md.txt
          rm -f school_project/llw_integration.sql
          rm -f school_project/schema.sql
          rm -f school_project/seed.sql
          rm -rf .git .github .gitignore
          rm -f *.md
          echo "✅ Removed test/debug files and git metadata"

      # ─── 4. Install lftp ───────────────────────────────────────
      - name: Install lftp
        run: sudo apt-get install -y lftp

      # ─── 5. FTP Deploy ด้วย lftp (รองรับ passive mode) ──────
      - name: Deploy via FTP
        run: |
          lftp -e "
            set ftp:passive-mode yes;
            set ftp:ssl-allow no;
            set net:timeout 30;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            open ftp://${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}@${{ secrets.FTP_SERVER }};
            mirror --reverse --delete --verbose --parallel=4 \
              --exclude ^\.git/ \
              --exclude ^\.github/ \
              --exclude ^uploads \
              --exclude chromebook/uploads \
              --exclude behavior/uploads \
              --exclude bus/uploads \
              --exclude school_project/uploads \
              --exclude parent_meeting/uploads \
              --exclude lms/uploads/exercises \
              --exclude ^assets/images/user_photos \
              ./ ${{ secrets.FTP_SERVER_DIR }};
            cd ${{ secrets.FTP_SERVER_DIR }};
            -mkdir chromebook/uploads;
            -mkdir behavior/uploads;
            -mkdir bus/uploads;
            -mkdir school_project/uploads;
            -mkdir parent_meeting/uploads;
            -mkdir lms/uploads;
            -mkdir lms/uploads/exercises;
            put lms/uploads/exercises/.htaccess -o lms/uploads/exercises/.htaccess;
            bye
          "
          echo "✅ Deploy completed successfully!"

      # ─── 6. Clear PHP OPcache & Run Stability Migration ────────
      - name: Clear PHP OPcache and Apply Pending Schema Updates
        run: |
          cat > /tmp/_opc.php << 'PHPEOF'
          <?php
          if (function_exists('opcache_reset')) { opcache_reset(); }
          require_once __DIR__ . '/config/database.php';
          try {
              $pdo = getPdo();
              $pdo->exec("CREATE TABLE IF NOT EXISTS _migrations (id INT AUTO_INCREMENT PRIMARY KEY, migration VARCHAR(255) NOT NULL UNIQUE, batch INT NOT NULL DEFAULT 1, executed_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4");
              $executed = $pdo->query("SELECT migration FROM _migrations")->fetchAll(PDO::FETCH_COLUMN);
              $batch = (int)$pdo->query("SELECT COALESCE(MAX(batch), 0) + 1 FROM _migrations")->fetchColumn();
              $autoTargets = [
                  '2026_05_05_000001_create_hr_daily_attendance',
                  '2026_05_09_000002_add_leave_chat_id_to_wfh_system_settings',
                  '2026_05_09_000003_add_duty_chat_id_and_evening_shift',
                  '2026_05_09_000004_add_duty_bot_token_to_settings',
                  '2026_05_09_000005_add_att_chat_id_to_wfh_system_settings',
                  '2026_05_09_000006_add_att_bot_token_to_wfh_system_settings',
                  '2026_10_20_233000_add_semester_support',
                  '2026_10_24_233000_system_stability_and_performance',
                  '2026_10_25_000001_add_leave_bot_token_to_wfh_system_settings',
                  '2026_10_26_220000_create_learning_media_table',
                  '2026_10_26_223000_enhance_learning_media_system',
                  '2026_10_26_231500_add_approvals_to_learning_media',
                  '2026_10_27_000001_add_attachments_to_lms_unit_exercises',
                  '2026_10_27_000002_set_club_semester_2',
                  '2026_10_28_000001_add_inactive_to_att_students_status',
                  '2026_10_28_000002_sync_official_548_students',
                  '2026_10_28_000003_force_exact_548_roster',
              ];
              foreach ($autoTargets as $mName) {
                  if (!in_array($mName, $executed, true)) {
                      $mFile = __DIR__ . '/database/migrations/' . $mName . '.php';
                      if (file_exists($mFile)) {
                          try {
                              $m = require $mFile;
                              if (is_array($m) && isset($m['up'])) {
                                  $m['up']($pdo);
                                  $st = $pdo->prepare("INSERT IGNORE INTO _migrations (migration, batch) VALUES (?, ?)");
                                  $st->execute([$mName, $batch]);
                              }
                          } catch (Throwable $me) {
                              error_log('[Deploy Auto-Migrate ' . $mName . '] ' . $me->getMessage());
                          }
                      }
                  }
              }
              // Auto-migrate Financial & Accounting System
              try {
                  $finTableExists = $pdo->query("SHOW TABLES LIKE 'fin_users'")->rowCount() > 0;
                  if (!$finTableExists && file_exists(__DIR__ . '/financial/database/migrate.php')) {
                      require_once __DIR__ . '/financial/app/Core/Database.php';
                      \App\Core\Database::setConnection($pdo);
                      require_once __DIR__ . '/financial/database/migrate.php';
                  }
              } catch (Throwable $fe) {
                  error_log('[Deploy Financial Migrate] ' . $fe->getMessage());
              }
              echo "ok";
          } catch (Throwable $e) {
              error_log('[Deploy Auto-Migrate] ' . $e->getMessage());
              echo "warn";
          }
          PHPEOF
          lftp -e "
            set ftp:passive-mode yes;
            set ftp:ssl-allow no;
            open ftp://${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}@${{ secrets.FTP_SERVER }};
            cd ${{ secrets.FTP_SERVER_DIR }};
            put /tmp/_opc.php -o _opc.php;
            bye
          "
          sleep 3
          curl -sf "https://llw.krusuched.com/_opc.php" || true
          lftp -e "
            set ftp:passive-mode yes;
            set ftp:ssl-allow no;
            open ftp://${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}@${{ secrets.FTP_SERVER }};
            cd ${{ secrets.FTP_SERVER_DIR }};
            rm _opc.php;
            bye
          "
          echo "✅ OPcache cleared & stability migrations applied"
